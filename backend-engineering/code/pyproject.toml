[project]
name = "lpu-code"
version = "0.1.0"
description = "Runnable class code for the LPU Backend + GenAI training"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "openai",
    "litellm",
    "pydantic",
    "python-dotenv",
    "email-validator>=2.3.0",
]

[tool.uv.workspace]
members = [
    "lpu-code",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
